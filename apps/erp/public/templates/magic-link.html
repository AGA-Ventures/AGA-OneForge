<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f7fa;color:#172033;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:32px 40px 8px;font-size:20px;font-weight:700;letter-spacing:-0.3px;">AGA OneForge</td>
            </tr>
            <tr>
              <td style="padding:24px 40px 40px;">
                <h1 style="margin:0 0 16px;font-size:28px;line-height:36px;letter-spacing:-0.6px;">Sign in to your account</h1>
                <p style="margin:0 0 28px;font-size:16px;line-height:24px;color:#526071;">Use this secure, one-time link to continue to AGA OneForge. It expires automatically for your protection.</p>
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="border-radius:8px;background:#14b8a6;">
                      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=magiclink" style="display:inline-block;padding:14px 22px;color:#ffffff;font-size:16px;font-weight:700;line-height:20px;text-decoration:none;">Sign in to AGA OneForge</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:13px;line-height:20px;color:#718096;">If you did not request this email, you can safely ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
